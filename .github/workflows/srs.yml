# CI of the SRS-DD framework repository itself.
# Target projects get their own workflow from ci/github-workflow.yml via
# tools/srs_init.py — do not copy this file.
#
# The suites live in tests/ and are the same ones tools/ci_selftest.sh
# runs locally, so a green pipeline and a green pre-commit mean the same
# thing.

name: srs

on:
  push:
  pull_request:

jobs:
  suites:
    runs-on: ubuntu-latest
    steps:
      # The whole history, and the tags with it: baselines are commits in
      # it, and the suites clone this repository to exercise the tooling
      # against a real one.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The templates end up in other people's repositories, so their
      # syntax is checked where a YAML parser is guaranteed to exist:
      # tools/ci_selftest.sh does the same locally, but skips it on a
      # machine without ruby.
      - name: CI templates are valid YAML
        run: |
          for f in ci/*.yml .github/workflows/srs.yml; do
            [ -e "$f" ] || continue
            ruby -ryaml -e "YAML.load_file('$f')" || exit 1
          done

      # Separate steps rather than one loop: the failing suite is then
      # the name in the summary, not a line in a log.
      - name: Checker rules
        run: tests/checker-rules.sh

      - name: Specification gate
        run: tests/spec-check.sh

      - name: Installer smoke
        run: tests/installer-smoke.sh

      - name: Adopt smoke
        run: tests/adopt-smoke.sh

      - name: Viewer smoke
        run: tests/view-smoke.sh

      - name: Upgrade smoke
        run: tests/upgrade-smoke.sh

      - name: Baseline smoke
        run: tests/baseline-smoke.sh

      - name: Release smoke
        run: tests/release-smoke.sh

      - name: Grounds rules
        run: tests/grounds-rules.sh

      - name: Grounds check
        run: tests/grounds-check.sh

      - name: Dates smoke
        run: tests/dates-smoke.sh

      - name: Render the specification
        run: |
          python3 tools/srs_view.py --html site/index.html \
            --repo-url "${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}"

      - uses: actions/upload-artifact@v7
        with:
          name: specification
          path: site

  # The example project as a downstream consumer: a change here that
  # stops accepting a specification which was valid shows up against a
  # real project rather than in somebody's repository. Advisory on
  # purpose — an external repository must not be able to block a release.
  example-smoke:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Its own tests are its own CI's business; what this job asks is
      # whether our tooling still accepts a specification that was valid.
      - name: Check the example against this working tree
        run: |
          git clone --depth 1 \
            https://github.com/CRELLIA-S-L/srs-dd-example-urlshortener.git /tmp/srs-example
          # Which files travel is the installer's list, read from the
          # installer itself. A hand-written pair here went stale when the
          # checker was split from its parser, and the job then failed on
          # the missing file instead of on the question it exists to ask.
          # Assigned before the loop, not substituted inside it: a
          # substitution that fails inside `for` is exempt from set -e
          # and would leave the list empty, which is this failure all
          # over again — nothing copied, and the missing file blamed.
          travels=$(python3 -Bc "import sys; sys.path.insert(0, 'tools'); import srs_init; print(*srs_init.TOOLS)")
          for f in $travels; do
            cp "tools/$f" /tmp/srs-example/tools/
          done
          cd /tmp/srs-example
          python3 tools/srs_check.py --strict
          python3 tools/srs_view.py --html /tmp/example-site/index.html

  # The published specification (FR-CI-040). Runs only on the default
  # branch and only after the suites pass — a page is worth publishing
  # exactly when the specification it renders is valid.
  #
  # This job needs Pages enabled for the repository: Settings → Pages →
  # Build and deployment → Source: "GitHub Actions". Without that setting
  # `deploy-pages` fails with "Get Pages site failed".
  pages:
    needs: suites
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      # The baselines the page compares are commits; a shallow checkout
      # has none of them and the page says so instead of showing them.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Render the specification
        run: |
          python3 tools/srs_view.py --html site/index.html \
            --repo-url "${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}"

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
