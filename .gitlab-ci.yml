# CI of the SRS-DD framework repository itself.
# Target projects get their own pipeline from ci/gitlab-ci.yml via
# tools/srs_init.py — do not copy this file.
#
# The suites live in tests/ rather than inline here: requirements in
# specs/ cite them by path, and a job script is not a citable artifact.
# tools/ci_selftest.sh runs every job below locally, which is what the
# pre-commit hook does.
#
# Full python image on purpose: the *-slim images lack git, which the
# freshness check needs.

spec-check:
  image: python:3.12
  script:
    - tests/spec-check.sh

installer-smoke:
  image: python:3.12
  script:
    - tests/installer-smoke.sh

adopt-smoke:
  image: python:3.12
  script:
    - tests/adopt-smoke.sh

view-smoke:
  image: python:3.12
  script:
    - tests/view-smoke.sh

# This framework's own specification, rendered. Skipped by
# tools/ci_selftest.sh: it verifies nothing and would leave public/ in
# the working tree on every commit.
pages:
  image: python:3.12
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - python3 tools/srs_view.py --html public/index.html --repo-url "$CI_PROJECT_URL/-/blob/$CI_COMMIT_SHA"
  artifacts:
    paths:
      - public

# The example project as a downstream consumer: a change here that stops
# accepting a specification which was valid shows up against a real
# project rather than in somebody's repository. Advisory — an external
# repository must not be able to fail this pipeline. Skipped by
# tools/ci_selftest.sh: it reaches the network.
example-smoke:
  image: python:3.12
  allow_failure: true
  script:
    - rm -rf /tmp/srs-example
    - git clone --depth 1 https://github.com/CRELLIA-S-L/srs-dd-example-urlshortener.git /tmp/srs-example
    - cp tools/srs_check.py tools/srs_view.py /tmp/srs-example/tools/
    # Its own tests are its own CI's business; what this job asks is
    # whether our tooling still accepts a specification that was valid.
    - cd /tmp/srs-example
    - python3 tools/srs_check.py --strict
    - python3 tools/srs_view.py --html /tmp/example-site/index.html
