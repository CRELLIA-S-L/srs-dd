# CI of the SRS-DD framework repository itself.
# Target projects get their own pipeline from ci/gitlab-ci.yml via
# tools/srs_init.py — do not copy this file.
#
# The suites live in tests/ rather than inline here: requirements in
# specs/ cite them by path, and a job script is not a citable artifact.
# tools/ci_selftest.sh runs every job below locally, which is what the
# pre-commit hook does.
#
# Full python image on purpose: the *-slim images lack git, which the
# freshness check needs.

spec-check:
  image: python:3.12
  script:
    - tests/spec-check.sh

installer-smoke:
  image: python:3.12
  script:
    - tests/installer-smoke.sh

adopt-smoke:
  image: python:3.12
  script:
    - tests/adopt-smoke.sh

view-smoke:
  image: python:3.12
  script:
    - tests/view-smoke.sh

# This framework's own specification, rendered. Skipped by
# tools/ci_selftest.sh: it verifies nothing and would leave public/ in
# the working tree on every commit.
pages:
  image: python:3.12
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - python3 tools/srs_view.py --html public/index.html --repo-url "$CI_PROJECT_URL/-/blob/$CI_COMMIT_SHA"
  artifacts:
    paths:
      - public
