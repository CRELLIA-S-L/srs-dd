# SRS-DD-VERSION specification gate.
# Template copied into target projects as .gitlab-ci.yml by
# tools/srs_init.py. If your project already has a .gitlab-ci.yml, merge
# the job below into it instead.
#
# Full python image on purpose: the *-slim images lack git, which the
# freshness check needs.
#
# GIT_DEPTH: 0 is per job rather than global: the baselines the rendered
# page compares are commits, and GitLab's default shallow clone holds none
# of them — but a global `variables:` here would collide with the one your
# project may already have.

spec-check:
  image: python:3.12
  variables:
    GIT_DEPTH: 0
  script:
    # The gate is srs-dd/tools/srs_gate.py, refreshed with the rest of the
    # tooling: the checker, and the grounds register's and the architecture
    # layer's where the project keeps them, then every generated file
    # compared with the one committed. Add --strict to fail on warnings.
    - python3 srs-dd/tools/srs_gate.py

# The readable specification as a build artifact: one self-contained
# HTML file, no Pages setup required. Delete this job if you do not
# want it. To publish through GitLab Pages instead, rename the job to
# `pages` — the artifact path is already the one Pages expects.
spec-site:
  image: python:3.12
  variables:
    GIT_DEPTH: 0
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    # The specification, and the page of each optional layer this project keeps
    # beside it, each told which others will be there. `if` rather than
    # `[ -d x ] && …`, which under `set -e` fails the job where it is absent.
    - |
      beside=""
      if [ -d arch ]; then beside="arch.html"; fi
      if [ -d grounds ]; then beside="${beside:+$beside,}grounds.html"; fi
      python3 srs-dd/tools/srs_view.py --html public/index.html ${beside:+--link "$beside"} \
        --repo-url "$CI_PROJECT_URL/-/blob/$CI_COMMIT_SHA"
      if [ -d arch ]; then
        others="index.html"
        if [ -d grounds ]; then others="index.html,grounds.html"; fi
        python3 srs-dd/tools/srs_arch_doc.py --html --link "$others" > public/arch.html
      fi
      if [ -d grounds ]; then
        others="index.html"
        if [ -d arch ]; then others="index.html,arch.html"; fi
        python3 srs-dd/tools/srs_grounds.py --html --link "$others" > public/grounds.html
      fi
  artifacts:
    paths:
      - public
